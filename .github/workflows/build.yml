name: Build addon

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build addon ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read addon version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path "RevathsMailbox/RevathsMailbox.toc" -Pattern '^## Version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Addon version was not found." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package addon
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "revaths-mailbox-build"
          $zipName = "RevathsMailbox-v${{ steps.version.outputs.version }}-${{ github.run_number }}.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath "RevathsMailbox" -Destination (Join-Path $staging "RevathsMailbox") -Recurse
          Copy-Item -LiteralPath "RevathsMailboxTooltipHelper" -Destination (Join-Path $staging "RevathsMailboxTooltipHelper") -Recurse
          Compress-Archive -LiteralPath (Join-Path $staging "RevathsMailbox"),(Join-Path $staging "RevathsMailboxTooltipHelper") -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevathsMailbox-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/RevathsMailbox-v${{ steps.version.outputs.version }}-${{ github.run_number }}.zip
          if-no-files-found: error